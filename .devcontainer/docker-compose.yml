services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
    environment:
      DATABASE_URL: postgres://bifrostnms:bifrostnms@postgres:5432/bifrostnms
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: timescale/timescaledb:2.29.0-pg17
    environment:
      POSTGRES_DB: bifrostnms
      POSTGRES_USER: bifrostnms
      POSTGRES_PASSWORD: bifrostnms
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bifrostnms -d bifrostnms']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
