[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=bifrostnms --cov-report=term-missing"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["bifrostnms"]
