name: BifrostNMS Website CI (Monorepo)

on:
  push:
    branches: ['main']
    tags: ['*']
    paths:
      - 'website/**'
      - 'Dockerfile.website'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.mjs'
      - 'prettier.config.js'
      - 'stylelint.config.js'
      - '.github/workflows/website-ci.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'website/**'
      - 'Dockerfile.website'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.mjs'
      - 'prettier.config.js'
      - 'stylelint.config.js'
      - '.github/workflows/website-ci.yml'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-fs-scan:
    name: Trivy FS Scan (Website)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          output: trivy-fs-scan.txt
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-scan-website
          path: trivy-fs-scan.txt

  checks:
    name: Website Lint, Typecheck and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint website
        run: pnpm --dir website lint
      - name: Typecheck website
        run: pnpm --dir website typecheck
      - name: Build website
        run: pnpm --dir website build

  build-image:
    name: Build Website Docker Image
    runs-on: ubuntu-latest
    needs: [checks, trivy-fs-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f Dockerfile.website -t bifrostnms-website:ci .

  trivy-image-scan:
    name: Trivy Image Scan (Website)
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f Dockerfile.website -t bifrostnms-website:ci .
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: bifrostnms-website:ci
          severity: HIGH,CRITICAL
          output: trivy-image-scan.txt
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-image-scan-website
          path: trivy-image-scan.txt
