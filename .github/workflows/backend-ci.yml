name: BifrostNMS Backend CI (Monorepo)

on:
  push:
    branches: ['main']
    tags: ['*']
    paths:
      - 'backend/**'
      - 'Dockerfile.backend'
      - 'entrypoint.sh'
      - 'tools/**'
      - 'pyproject.toml'
      - '.coveragerc'
      - 'codecov.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/backend-ci.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'backend/**'
      - 'Dockerfile.backend'
      - 'entrypoint.sh'
      - 'tools/**'
      - 'pyproject.toml'
      - '.coveragerc'
      - 'codecov.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/backend-ci.yml'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-linters:
    name: Run Tests and Linters
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bifrostnms
          POSTGRES_USER: bifrostnms
          POSTGRES_PASSWORD: bifrostnms
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U bifrostnms -d bifrostnms"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      BIFROSTNMS_ENV: test
      BIFROSTNMS_DATABASE_URL: postgres://bifrostnms:bifrostnms@localhost:5432/bifrostnms
      BIFROSTNMS_REDIS_URL: redis://localhost:6379/0
      BIFROSTNMS_CELERY_BROKER_URL: redis://localhost:6379/1
      BIFROSTNMS_CELERY_RESULT_BACKEND: redis://localhost:6379/2
      BIFROSTNMS_CELERY_TASK_ALWAYS_EAGER: 'true'
      BIFROSTNMS_AUTH_ENCRYPTION_KEY: ci-test-key-not-for-production
      BIFROSTNMS_COOKIE_SECURE: 'false'
      BIFROSTNMS_WEBAUTHN_RP_ID: localhost
      BIFROSTNMS_WEBAUTHN_RP_NAME: BifrostNMS
      BIFROSTNMS_WEBAUTHN_ORIGIN: http://localhost:3001

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements/*.in
            backend/requirements/*.txt

      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Add Node binaries to PATH
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/frontend/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/auth-frontend/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: pip install -r backend/requirements/dev.in

      - name: Install shell tooling
        run: |
          tools/setup/install-shellcheck
          tools/setup/install-shfmt

      - name: Fetch main for lint comparison
        if: github.event_name == 'pull_request'
        run: git fetch origin main

      - name: Run backend tests
        run: pytest backend -v

      - name: Generate coverage report
        run: coverage xml -o backend/coverage.xml

      - name: Run linters
        run: tools/lint

      - name: Upload coverage to Codecov
        if: ${{ github.event_name == 'push' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/coverage.xml
          flags: backend,unittests
          name: Backend Coverage
          fail_ci_if_error: false
          verbose: true

  trivy-fs-scan:
    name: Trivy FS Scan (Backend + Root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          output: trivy-fs-scan.txt
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-scan-backend
          path: trivy-fs-scan.txt

  build-image:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: [tests-and-linters, trivy-fs-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f Dockerfile.backend -t bifrostnms-backend:ci .

  trivy-image-scan:
    name: Trivy Image Scan (Backend)
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f Dockerfile.backend -t bifrostnms-backend:ci .
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: bifrostnms-backend:ci
          severity: HIGH,CRITICAL
          output: trivy-image-scan.txt
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-image-scan-backend
          path: trivy-image-scan.txt
