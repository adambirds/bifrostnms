name: Autofix foundation

on:
  push:
    paths:
      - '.github/workflows/autofix-foundation.yml'
      - 'auth-frontend/**'
      - 'frontend/**'
      - 'backend/**'
      - 'tools/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: write

concurrency:
  group: autofix-foundation
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Fix CSS
        run: |
          pnpm --dir auth-frontend exec stylelint 'src/**/*.css' --fix
          pnpm --dir frontend exec stylelint 'src/**/*.css' --fix
      - name: Format Node-managed files
        run: pnpm exec prettier --write pnpm-lock.yaml auth-frontend/stylelint.config.js frontend/stylelint.config.js auth-frontend/eslint.config.mjs frontend/eslint.config.mjs
      - name: Format Python
        run: |
          pip install ruff
          ruff check --fix backend/bifrostnms/email/__init__.py backend/tests/test_auth_permissions.py backend/tests/test_auth_webauthn_flows.py backend/tests/test_email_backend_selection.py
          ruff format backend/bifrostnms/auth/webauthn.py backend/bifrostnms/email/__init__.py backend/tests/test_auth_permissions.py backend/tests/test_auth_webauthn_flows.py backend/tests/test_email_backend_selection.py tools/ruff_tui.pyi tools/run-mypy
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo 'Nothing to fix.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth-frontend frontend backend tools pnpm-lock.yaml
          git commit -m 'style: apply project lint fixes'
          git push origin HEAD:main
