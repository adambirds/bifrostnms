name: Sync shared tooling once

on:
  push:
    paths:
      - .github/workflows/sync-tools-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BifrostNMS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout shared tooling source
        uses: actions/checkout@v4
        with:
          repository: adb-software-solutions/techwiki.co.uk
          path: .tooling-source

      - name: Copy tools directory exactly
        run: |
          rm -rf tools
          cp -a .tooling-source/tools ./tools
          rm -rf .tooling-source
          rm -f .github/workflows/sync-tools-once.yml

      - name: Commit synced tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools .github/workflows/sync-tools-once.yml
          git commit -m "Sync shared project tooling from TechWiki"
          git push
