name: BifrostNMS Dashboard CI (Monorepo)

on:
  push:
    branches: ['main']
    tags: ['*']
    paths:
      - 'frontend/**'
      - 'Dockerfile.frontend'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.mjs'
      - 'prettier.config.js'
      - 'stylelint.config.js'
      - '.github/workflows/frontend-ci.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'frontend/**'
      - 'Dockerfile.frontend'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.mjs'
      - 'prettier.config.js'
      - 'stylelint.config.js'
      - '.github/workflows/frontend-ci.yml'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-fs-scan:
    name: Trivy FS Scan (Dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          output: trivy-fs-scan.txt
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-scan-dashboard
          path: trivy-fs-scan.txt

  run-linters:
    name: Run Linters (root tools/lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/dev.in

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Add Node binaries to PATH
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/frontend/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/auth-frontend/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install Python tooling dependencies
        run: pip install -r backend/requirements/dev.in

      - name: Install shell tooling
        run: |
          tools/setup/install-shellcheck
          tools/setup/install-shfmt

      - name: Fetch main for lint comparison
        if: github.event_name == 'pull_request'
        run: git fetch origin main

      - name: Run all linters
        run: tools/lint

  run-tests:
    name: Run Dashboard Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck dashboard
        run: pnpm --dir frontend typecheck

      - name: Lint dashboard
        run: pnpm --dir frontend lint

  build-and-analyze:
    name: Build and Bundle Analysis
    runs-on: ubuntu-latest
    needs: [run-linters, run-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dashboard for analysis
        working-directory: frontend
        run: pnpm run build
        timeout-minutes: 5

      - name: Upload bundle analysis to Codecov
        if: ${{ github.event_name == 'push' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          plugin: bundler
          flags: frontend
          name: Dashboard Bundle Analysis
          directory: ./frontend/.next
          fail_ci_if_error: false
          verbose: true

  build-image:
    name: Build Dashboard Docker Image
    runs-on: ubuntu-latest
    needs: [run-linters, trivy-fs-scan, build-and-analyze]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f Dockerfile.frontend -t bifrostnms-frontend:ci .

  trivy-image-scan:
    name: Trivy Image Scan (Dashboard)
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f Dockerfile.frontend -t bifrostnms-frontend:ci .
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: bifrostnms-frontend:ci
          severity: HIGH,CRITICAL
          output: trivy-image-scan.txt
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-image-scan-dashboard
          path: trivy-image-scan.txt
